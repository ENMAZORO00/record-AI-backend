# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - recordai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for Azure login
      contents: read # Required for checkout

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      # 3. Install dependencies & build
      - name: Install dependencies and build
        run: |
          npm ci
          npx prisma generate
          npm run build --if-present

      # (Optional) Run tests
      - name: Run tests
        run: npm run test --if-present

      # 4. Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F62BD0E94E3F46F7A613FDC24F05FFB2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0446FF20DA1F4BA59750DD2F7BB1FB0E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_354C48DF701F4D80916772CC3B309BF1 }}

      # 5. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "recordai"
          slot-name: "Production"
          package: .
